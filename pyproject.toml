[project]
name = "pilm"
version = "0.1.0"
description = "Prosody-Internalized Language Model"
requires-python = ">=3.10"
authors = [{ name = "Felipe" }]
readme = "README.md"

dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "soundfile>=0.12",
    "numpy>=1.24",
    "scipy>=1.11",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "pandas>=2.0",
]

[project.optional-dependencies]

# Acoustic feature extraction (F0, energy, duration). Phase 3+.
acoustic = [
    "librosa>=0.10",
    "praat-parselmouth>=0.4",
    "pyworld>=0.3",
]

# Classical ML and training utilities. Phase 2+.
ml = [
    "scikit-learn>=1.3",
    "accelerate>=0.27",
]

# Speaker embeddings (ECAPA-TDNN) for non-lossy speaker baseline clustering. Phase 3.
speaker = [
    "speechbrain>=1.0",
]

# Logging and experiment tracking. Phase 4+.
training = [
    "wandb>=0.16",
    "tensorboard>=2.15",
]

# Plotting and notebook work for spot-checks.
viz = [
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "jupyter>=1.0",
]

# Literature downloader. One-off; only needed when fetching paywalled PDFs.
litt = [
    "playwright>=1.48",
]

# Development.
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "mypy>=1.8",
]

# Convenience: install everything except dev.
all = [
    "pilm[acoustic,ml,speaker,training,viz]",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "scripts*"]
exclude = ["data*", "litt*", "fst*", "cmu_us_awb_arctic*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

# Notes on installs that need conda or external toolchains:
#
# - Montreal Forced Aligner (MFA): used in Phase 3 for phone-level alignment.
#   Install via conda: `conda install -c conda-forge montreal-forced-aligner`.
#   Not pip-installable cleanly. Add to environment in Phase 3.
#
# - For Apple Silicon: pyworld may need `brew install gcc` first to compile.
#   `pip install pyworld --no-build-isolation` if standard install fails.
#
# - For wav2vec2 / WavLM model downloads: requires internet access and
#   ~1.5 GB disk per model. Check `huggingface-cli login` if you hit quotas.
